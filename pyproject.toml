[project]
name = "paperclf"
version = "0.1.0"
description = "KMS 논문 적합도 분류기 — LLM 교사 라벨로 학습한 CPU 학생 모델과 서빙 API"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
train = [
    "scikit-learn>=1.5",
    "skl2onnx>=1.17",
    "onnx>=1.17",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # starlette 1.x 시험 클라이언트가 httpx 사용 시 내는 안내 경고 한 건만 허용한다
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
