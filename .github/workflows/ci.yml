name: ci
# 코드 판: PR·main → 시험, v* 태그 → 이미지(GHCR) → (서버가 준비되면) 배포
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked --group train
      - run: uv run --locked --group train pytest

  image: # 시험을 통과해야만 이미지를 만든다. 태그일 때만 GHCR 에 올린다
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/paperclf-api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 판 이름
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [[ $IS_TAG == true ]]; then
            [[ $REF_NAME =~ ^v[0-9]+(\.[0-9]+)*$ ]] || { echo "태그 형식이 아니다: $REF_NAME" >&2; exit 1; }
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: api/Dockerfile
          build-args: APP_VERSION=${{ steps.tag.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy: # 내 서버의 러너가 새 이미지로 바꾼다 — 저장소 변수 DEPLOY_ENABLED=true 일 때만
    needs: image
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, lightsail, paperclf]
    concurrency: { group: lightsail, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cp deploy/lightsail/compose.yml deploy/lightsail/server.sh /srv/paperclf/
      - run: printf '%s\n' "$GHCR_TOKEN" | bash /srv/paperclf/server.sh image "$TAG" "$IMAGE"
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
