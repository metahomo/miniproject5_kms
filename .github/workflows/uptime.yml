name: uptime
# 운영 감시: 밖에서 매시간 두 서버의 /health 를 부른다. 응답이 없거나 status 가 ok 가 아니면 실패 → GitHub 가 저장소 주인에게 알린다
#   최종: 과제 도메인(첫 화면은 KMS 웹이지만 /health 는 paperclf 가 답한다) · 작업용: sslip.io 이름
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false # 한 서버가 죽어도 다른 서버 결과는 따로 남긴다
      matrix:
        include:
          - name: 최종
            url: https://nlpwizard.eta.pyhub.kr/health
          - name: 작업용
            url: https://54-252-22-31.sslip.io/health
    name: health (${{ matrix.name }})
    env:
      URL: ${{ matrix.url }}
      NAME: ${{ matrix.name }}
    steps:
      - name: /health (세 번까지 다시)
        run: |
          for i in 1 2 3; do
            if H=$(curl -fsS --max-time 15 "$URL"); then
              echo "$H" | python3 -c 'import sys, json; d = json.load(sys.stdin); print(d["status"], d["app_version"], d["model_version"]); sys.exit(0 if d["status"] == "ok" else 1)' && exit 0
            fi
            sleep 20
          done
          echo "운영 /health 실패 ($NAME): $URL" >&2; exit 1
      - name: 요약
        if: always()
        run: curl -fsS --max-time 15 "$URL" | NAME="$NAME" python3 -c 'import os, sys, json; d = json.load(sys.stdin); print(f"### {os.environ[\"NAME\"]} {d[\"status\"]} — app {d[\"app_version\"]} · model {d[\"model_version\"]}")' >> "$GITHUB_STEP_SUMMARY" || echo "### $NAME 응답 없음" >> "$GITHUB_STEP_SUMMARY"
