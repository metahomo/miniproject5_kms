# 서버의 바라는 상태는 .env : IMAGE, TAG, MODEL_VERSION, MODEL_DIR (server.sh 가 바꾼다)
services:
  api:
    image: ${IMAGE}/paperclf-api:${TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # 밖에는 Caddy(80/443)만 연다 — 5단계 HTTPS
    environment:
      MODEL_IMPL: onnx
      MODEL_DIR: ${MODEL_DIR:-/models/none}
      API_TOKEN: ${API_TOKEN:-} # /predict 토큰(서버 .env 에만) — 비우면 인증 안 함
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
      LEDGER_DSN: ${LEDGER_DSN:-} # 예측 로그(ADR-009) — 서버 .env 에만, 비우면 기록 안 함
    volumes:
      - /srv/paperclf/models:/models:ro
    networks: [default, ledger]

networks:
  ledger: # 장부 DB(paperclf-ledger)와 같은 도커 네트워크 — 서버에서 한 번 `docker network create paperclf-ledger-net`
    external: true
    name: paperclf-ledger-net
